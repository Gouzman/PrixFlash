[package]
name = "pubprix-engine"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = "0.25"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tiny-skia = "0.11"
base64 = "0.22"
